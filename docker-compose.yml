# HALT local stack. All data is synthetic (SIMULATED).
# Usage: docker compose up --build -d --wait
name: halt

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: halt
      POSTGRES_PASSWORD: halt
      POSTGRES_DB: halt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the halt_app role on first start (demo credentials; see the file).
      - ./services/api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halt -d halt"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    environment:
      # The owner creates the schema and grants; the API then runs as halt_app, which may only read and
      # append to the audit log and the operation journal.
      HALT_DB_MIGRATE_URL: postgresql+psycopg://halt:halt@db:5432/halt
      HALT_DB_URL: postgresql+psycopg://halt_app:halt_app@db:5432/halt
      HALT_DB_APP_ROLE: halt_app
      HALT_SEED: "2417"
      HALT_LLM_ENABLED: "false"
      HALT_SIGNING_KEY_PATH: /home/halt/secrets/demo-signing-key.pem
      HALT_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /ready answers 200 only when the database is up and every incident is seeded or restored.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Inlined into the browser bundle at build time: the browser reaches the API on the host's port 8000.
      args:
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
        NEXT_PUBLIC_WS_ORIGIN: ws://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: simulated
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
