name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I scripts/verify_repo.py

  api:
    name: API (ruff, mypy, pytest incl. PostgreSQL audit trigger)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: halt
          POSTGRES_PASSWORD: halt
          POSTGRES_DB: halt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U halt -d halt_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      HALT_TEST_PG_URL: postgresql+psycopg://halt:halt@localhost:5432/halt_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  web:
    name: Web (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: Contract drift (AT-1.4, AT-1.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install -e "services/api[dev]"
      - run: npm ci
      - name: Regenerate fixtures, OpenAPI and TS types
        run: |
          cd services/api
          python -m halt.scenario.background
          python scripts/export_openapi.py
          python scripts/record_fixtures.py
          cd ../..
          npm run gen:api
      - name: Fail if anything generated is out of date
        run: git diff --exit-code -- services/api/openapi.json services/api/halt/scenario/inc_2417/background_events.json apps/web/src/lib/api/schema.d.ts apps/web/tests/fixtures/api/stages.json

  e2e:
    name: E2E (Playwright + axe, real API)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install -e "services/api[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @halt/web
        env:
          CI: "1"
          HALT_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  compose:
    name: Compose stack health (AT-0.4)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 300
      - name: Health and readiness against PostgreSQL
        run: |
          body=$(curl -fsS http://localhost:8000/api/v1/health)
          echo "$body"
          echo "$body" | python3 -c "import json,sys;b=json.load(sys.stdin);assert b['status']=='ok' and b['db']=='ok' and b['audit_enforcement']=='db',b"
          curl -fsS http://localhost:8000/api/v1/ready
          curl -fsS http://localhost:3000/healthz
      - name: The application role cannot change the audit log
        run: |
          if docker compose exec -T -e PGPASSWORD=halt_app db psql -v ON_ERROR_STOP=1 -U halt_app -d halt -c "DELETE FROM audit_log"; then
            echo "halt_app was able to delete from audit_log" && exit 1
          fi
      - name: Restart restores the incident
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/incidents/INC-2417/correlate -H 'content-type: application/json' -d '{}' > /dev/null
          docker compose restart api
          docker compose up -d --wait api
          curl -fsS http://localhost:8000/api/v1/ready
          curl -fsS http://localhost:8000/api/v1/incidents/INC-2417 | python3 -c "import json,sys;b=json.load(sys.stdin);assert b['state']=='forecast_ready',b['state']"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
