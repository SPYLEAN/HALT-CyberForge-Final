<title>HALT Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0E1214;--surface:#151B1E;--raised:#1C2428;--line:#232B30;--border:#707D84;--text:#F1F0EA;--text2:#9AA3A8;--dis:#59656B;
--ember:#D4572F;--ember-t:#EC7B56;--ember-s:rgba(212,87,47,.15);--verd:#3E9C86;--verd-t:#52B8A1;--verd-s:rgba(62,156,134,.15);--neu:#707D84;
--fd:"Archivo",ui-sans-serif,system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fd);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
.mono{font-family:var(--fm)}
.k{font-family:var(--fm);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);line-height:14px}
#app{display:grid;grid-template-columns:216px minmax(0,1fr) 344px;grid-template-rows:68px minmax(0,1fr) 132px;grid-template-areas:"nav rib rib" "nav ws rail" "nav tl rail";height:100vh;min-height:720px;min-width:1180px}
#nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0}
#rib{grid-area:rib;overflow:hidden;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0;padding:0 20px;background:var(--bg);min-width:0}
#ws{grid-area:ws;overflow:auto;position:relative;min-width:0}
#rail{grid-area:rail;background:var(--surface);border-left:1px solid var(--line);overflow:auto}
#tl{grid-area:tl;border-top:1px solid var(--line);background:var(--surface);padding:8px 20px 8px;min-width:0}
/* nav */
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 14px;font-weight:800;font-stretch:125%;letter-spacing:.14em;font-size:18px}
.brand svg{height:26px;width:auto}
.incchip{margin:0 14px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.incchip b{display:block;font-size:13px;font-weight:600;margin-top:2px}
.navi{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 20px;background:none;border:0;border-left:2px solid transparent;width:100%;text-align:left;color:var(--text2);font-size:14px}
.navi:hover{background:var(--raised);color:var(--text)}
.navi[aria-current=page]{background:var(--raised);color:var(--text);font-weight:600;border-left-color:var(--text)}
.navi svg{flex:none}.navi .bd{margin-left:auto;font-family:var(--fm);font-size:10.5px;color:var(--text2)}
.navfoot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
/* ribbon */
.rf{display:flex;flex-direction:column;gap:3px;padding:0 14px;flex:none;border-left:1px solid var(--line);min-width:0;white-space:nowrap}
.rf:first-child{padding-left:0;border-left:0}
.rf .v{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.rsp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:24px;padding:0 10px;border:1px solid var(--text);border-radius:2px;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.pill i{width:8px;height:8px;background:var(--ember)}.pill.ok i{background:var(--verd)}.pill.n i{background:var(--neu)}
.pill.ok{border-color:var(--verd)}
.btn{min-height:36px;display:inline-flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--text);border-radius:4px;background:transparent;font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--text);color:var(--bg)}
.btn.pri{background:var(--text);color:var(--bg);font-weight:500}.btn.pri:hover:not(:disabled){background:#fff}
.btn.q{border-color:var(--border)}
.btn:disabled{border-color:#3A454B;color:var(--dis);cursor:not-allowed;background:transparent}
.btn.sm{min-height:28px;padding:0 10px;font-size:10.5px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg button{min-height:32px;padding:0 12px;border:0;background:none;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg);font-weight:500}
.score{display:inline-flex;align-items:baseline;gap:6px;background:none;border:0;border-bottom:1px dotted var(--text2);padding:0;font-family:var(--fm);font-size:14px;font-weight:500;color:var(--text)}
.score small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.score:hover{border-bottom-color:var(--text)}
/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;min-height:20px;padding:0 7px;border:1px solid var(--border);border-radius:2px;font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--text)}
.tag:before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.t-obs{border-color:var(--ember);background:var(--ember-s);color:var(--ember-t)}
.t-inf{border-style:dashed;color:var(--text)}.t-inf:before{background:none;border:1.5px dashed currentColor}
.t-fc{border-style:dashed;border-color:var(--ember);color:var(--ember-t)}.t-fc:before{background:none;border:1.5px dotted currentColor}
.t-sim{border-style:dotted;color:var(--text2);background-image:repeating-linear-gradient(135deg,rgba(241,240,234,.07) 0 4px,transparent 4px 8px)}.t-sim:before{background:none;border:1.5px dotted currentColor}
.t-ok{border-color:var(--verd);background:var(--verd-s);color:var(--verd-t)}
.t-n{color:var(--text2)}.t-n:before{display:none}
.simbox{border:1px dotted var(--border);border-radius:4px;background-image:repeating-linear-gradient(135deg,rgba(241,240,234,.035) 0 6px,transparent 6px 12px)}
/* workspace */
.wsbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px}
.wsbar.rep{background:var(--raised)}
.wsbar .m{flex:1;min-width:0}.wsbar .m b{font-weight:600}
.wsbar .m p{color:var(--text2);font-size:13px;margin-top:1px}
.pg{padding:22px 24px 40px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.ph h2{font-size:26px;font-weight:700;font-stretch:108%;line-height:1.1}
.ph p{color:var(--text2);margin-top:4px;max-width:70ch}
.sec{border-top:1px solid var(--line);padding:16px 0}
.sec>header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec h3{font-size:15px;font-weight:700;font-stretch:105%}
.sec p{max-width:68ch}.sec p+p{margin-top:8px}.muted{color:var(--text2)}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px}
.ovr{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:12px}
.canvas{background:#0B0F11;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:auto}
.cvtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lay{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:none;font-size:12.5px}
.lay[aria-pressed=true]{background:var(--raised);border-color:var(--text)}.lay[aria-pressed=false]{color:var(--dis)}
.lay svg{flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:2px;background:none;font-family:var(--fm);font-size:11px}
.chip[aria-pressed=true]{border-color:var(--text);background:var(--raised)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--fm);font-weight:400;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--surface)}
.tbl td.n{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.stages{display:flex;gap:0;margin:8px 0}
.stg{flex:1;padding:8px 8px 8px 0;border-top:3px solid var(--line);font-size:12px;color:var(--text2)}
.stg.done{border-top-color:var(--ember);color:var(--text)}.stg.cur{border-top-color:var(--ember);color:var(--text);font-weight:600}
.stg.next{border-top:3px dotted var(--ember);color:var(--ember-t)}
.stg small{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
details{border-top:1px solid var(--line)}
details>summary{list-style:none;cursor:pointer;min-height:36px;display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:600;font-size:13px}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"+";font-family:var(--fm);width:14px;color:var(--text2)}
details[open]>summary:before{content:"−"}
details .dd{padding:0 0 12px 22px;color:var(--text2);font-size:13px}
.bar2{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.bar2 .l{width:200px;flex:none}.bar2 .t{flex:1;height:10px;background:var(--line);position:relative}.bar2 .f{position:absolute;inset:0 auto 0 0}
.bar2 .vv{width:150px;flex:none;font-family:var(--fm);font-size:12px}
.fgrid{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:4px;overflow:hidden}
.fgrid>div{padding:12px 14px;border-top:1px solid var(--line);font-size:13px}
.fgrid>div:not(.l){border-left:1px solid var(--line)}
.fgrid .l{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.fgrid .top{border-top:0}.fgrid .win{background:var(--raised)}
.fgrid .v{font-family:var(--fm);font-size:15px;font-weight:500;display:block}
.fgrid svg{width:100%;height:auto;display:block}
.act{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.act .id{font-family:var(--fm);font-weight:500}.act h4{font-size:15px;font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px;font-size:12.5px}
.tri span{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.callout{border:1px solid var(--border);border-radius:4px;padding:14px 16px;background:var(--surface)}
.callout.cf{border-color:var(--ember)}
.callout h4{font-size:15px;font-weight:700;margin-bottom:6px}
.callout ul{margin:6px 0 0;padding-left:18px;color:var(--text2)}
.prog{height:6px;background:var(--line);margin-top:6px}.prog i{display:block;height:100%;background:var(--text)}
.claim{display:grid;grid-template-columns:28px minmax(0,1fr) 200px;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.sig{width:20px;height:20px;margin-top:2px}
.claim h4{font-size:15px;font-weight:700}
.claim .res{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-family:var(--fm);font-size:13px}
.hist{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:8px}.hist i{flex:1;background:var(--ember);opacity:.75;min-height:1px}
/* rail */
.rl{padding:16px 18px 40px}
.rl h3{font-size:19px;font-weight:700;font-stretch:106%;line-height:1.2;margin:8px 0 6px}
.rl .kv{display:grid;grid-template-columns:96px 1fr;gap:0}
.rl .kv dt,.rl .kv dd{padding:8px 0;border-top:1px solid var(--line);margin:0;font-size:13px}
.rl .kv dt{font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);padding-top:11px}
.lk{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;text-align:left}
.lk:hover{text-decoration-color:var(--text)}
.cb{display:flex;align-items:center;gap:10px}.cb .t{flex:1;height:6px;background:var(--line)}.cb .f{height:100%;background:var(--text)}
/* timeline */
.tlh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tlh .rd{font-family:var(--fm);font-size:12px;margin-left:8px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}.tlh>*{flex:none}.tlh>.k{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:64px;margin:0 6px}
.trk .ln{position:absolute;left:0;top:22px;height:0;border-top:3px solid var(--ember)}
.trk .fz{position:absolute;top:10px;height:26px;border:1px dotted var(--ember);background-image:repeating-linear-gradient(135deg,rgba(212,87,47,.12) 0 4px,transparent 4px 8px)}
.trk .fz span{position:absolute;left:8px;top:5px;font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;color:var(--ember-t);text-transform:uppercase}
.trk .ev{position:absolute;top:17px;width:11px;height:11px;margin-left:-5px;background:var(--text);box-shadow:0 0 0 3px var(--surface)}
.trk .ev.off{background:var(--dis)}
.trk .el{position:absolute;top:36px;transform:translateX(-50%);font-family:var(--fm);font-size:9.5px;color:var(--text2);white-space:nowrap;text-align:center;line-height:1.25}
.trk .now{position:absolute;top:8px;bottom:14px;border-left:1px dashed var(--text2)}
.trk .nl{position:absolute;top:-4px;transform:translateX(-50%);font-family:var(--fm);font-size:9px;letter-spacing:.08em;color:var(--text2)}
.trk input{position:absolute;left:-6px;right:-6px;top:6px;width:calc(100% + 12px);height:32px;margin:0;background:none;-webkit-appearance:none;appearance:none}
.trk input::-webkit-slider-runnable-track{height:32px;background:none}
.trk input::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:32px;background:var(--text);border:0;border-radius:0;box-shadow:0 0 0 2px var(--surface)}
.trk input::-moz-range-track{height:32px;background:none}.trk input::-moz-range-thumb{width:4px;height:32px;background:var(--text);border:0;border-radius:0}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(5,8,9,.6);z-index:40;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:41;display:none;flex-direction:column}
#drawer.on,#scrim.on{display:flex}#scrim.on{display:block}
#drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
#drawer .db{padding:6px 22px 22px;overflow:auto;flex:1}
#drawer h2{font-size:20px;font-weight:700;font-stretch:106%}
.hold{position:relative;overflow:hidden;min-height:48px;width:100%;border:1px solid var(--text);border-radius:4px;background:transparent;font-family:var(--fm);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;user-select:none;touch-action:none}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:var(--text);opacity:.25}
.hold span{position:relative}
.hold:disabled{border-color:#3A454B;color:var(--dis);cursor:not-allowed}
.ap{border:1px solid var(--border);border-radius:4px;padding:12px 14px;margin-top:10px}.ap.ok{border-color:var(--verd)}
.ap .r{display:flex;justify-content:space-between;gap:10px;align-items:center}
#spec{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;overflow:auto}
#spec.on{display:block}
.sp{max-width:1040px;margin:0 auto;padding:32px 32px 80px}
.sp h1{font-size:32px;font-weight:700;font-stretch:110%}.sp h2{font-size:20px;font-weight:700;margin:36px 0 10px;border-top:1px solid var(--border);padding-top:16px}
.sp h3{font-size:16px;margin:0}.sp code,.sp pre{font-family:var(--fm);font-size:12px}
.sp pre{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;overflow:auto;white-space:pre-wrap}
.spc{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:200px 1fr;gap:20px}
.spc dl{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;font-size:12.5px}.spc dt{font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);padding-top:2px}.spc dd{margin:0}
#toast{position:fixed;left:236px;bottom:150px;z-index:70;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:4px;font-size:13px;display:none;max-width:420px}
.gl{font:500 11px var(--fm);fill:#F1F0EA;paint-order:stroke;stroke:#0B0F11;stroke-width:3px;stroke-linejoin:round}
.gl.d{fill:#9AA3A8}.gl.e{fill:#EC7B56}.gl.v{fill:#52B8A1}
.gn{cursor:pointer}.gn:hover .hl{opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app">
<aside id="nav" aria-label="HALT systems"></aside>
<header id="rib"></header>
<main id="ws" tabindex="-1"></main>
<aside id="rail" aria-label="Evidence rail"></aside>
<footer id="tl"></footer>
</div>
<div id="scrim"></div><div id="drawer" role="dialog" aria-modal="true" aria-label="Approval"></div>
<div id="spec" role="dialog" aria-modal="true" aria-label="Component specifications"></div>
<div id="toast" role="status" aria-live="polite"></div>
